[package]
name = "svga-preview-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "WebAssembly adapter for the SVGA browser preview"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
svga = "=0.1.4"
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
